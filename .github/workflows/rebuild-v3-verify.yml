name: Rebuild V3 verification

on:
  push:
    branches:
      - rebuild/mega-room-v3-40pass
  pull_request:
    paths:
      - "src/v3/**"
      - "tools/verify-rebuild-v3-*.mjs"
      - "v3.html"
      - "v3-wall-test.html"
      - "v3-style.css"
      - ".github/workflows/rebuild-v3-verify.yml"

jobs:
  deterministic-design-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify V3 Pass 01 layout
        run: node tools/verify-rebuild-v3-pass01.mjs
      - name: Verify V3 Pass 02 physics
        run: node tools/verify-rebuild-v3-pass02.mjs
      - name: Verify V3 Pass 03 movement feel
        run: node tools/verify-rebuild-v3-pass03.mjs
      - name: Verify V3 Pass 04 wall movement
        run: node tools/verify-rebuild-v3-pass04.mjs
