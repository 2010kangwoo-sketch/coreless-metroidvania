name: Rebuild V4 verification

on:
  push:
    branches:
      - rebuild/mega-room-v4-40pass
  pull_request:
    paths:
      - "src/v4/**"
      - "tools/verify-rebuild-v4-*.mjs"
      - "v4.html"
      - "v4-style.css"
      - ".github/workflows/rebuild-v4-verify.yml"
      - "server/**"

jobs:
  scale-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify V4 Pass 01 scale layout
        run: node tools/verify-rebuild-v4-pass01.mjs
      - name: Verify V4 Pass 02 movement budget
        run: node tools/verify-rebuild-v4-pass02.mjs
      - name: Verify V4 Pass 03 world streaming
        run: node tools/verify-rebuild-v4-pass03.mjs
      - name: Verify V4 Pass 04 checkpoints and save
        run: node tools/verify-rebuild-v4-pass04.mjs
      - name: Verify V4 Pass 05 story and guidance
        run: node tools/verify-rebuild-v4-pass05.mjs
      - name: Verify V4 pre-pass quality foundation
        run: node tools/verify-rebuild-v4-quality-foundation.mjs
      - name: Verify V4 start screen
        run: node tools/verify-rebuild-v4-start-screen.mjs
      - name: Verify V4 account and save contract
        run: node tools/verify-rebuild-v4-account-save.mjs
      - name: Verify V4 reset pre-pass production contract
        run: node tools/verify-rebuild-v4-prepass.mjs
      - name: Verify V4 reset Pass 01 room plan
        run: node tools/verify-rebuild-v4-reset-pass01.mjs
      - name: Install account server dependencies
        working-directory: server
        run: npm ci
      - name: Verify V4 account server
        run: node tools/verify-rebuild-v4-account-server.mjs
