<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071015">
  <meta name="description" content="Coreless V4 층별 체크포인트와 안전한 브라우저 저장·복귀">
  <title>Coreless V4 · Checkpoint and Save Pass 04</title>
  <link rel="stylesheet" href="v4-style.css?v=pass04">
</head>
<body>
  <main class="v4-shell">
    <header class="v4-header">
      <div>
        <p>CORELESS · REBUILD V4</p>
        <h1>PASS 04 / CHECKPOINT AND SAVE</h1>
      </div>
      <span id="v4AuditStatus">AUDIT PENDING</span>
    </header>

    <section class="v4-panel v4-lab-panel" aria-label="체크포인트와 브라우저 저장 실험실">
      <canvas
        id="v4CheckpointLab"
        width="1400"
        height="900"
        tabindex="0"
      ></canvas>
    </section>

    <p class="v4-note v4-lab-note">
      A/D 이동 · E 층 끝 승강기 · K 패배 복귀 · F 낙하 복귀 · R 체크포인트 재시작 · C 저장 초기화.
      층 끝과 S35에서 자동 저장되며 새로고침 뒤에도 마지막 안전 지점에서 시작합니다.
    </p>

    <section class="v4-panel" aria-label="첫 초대형 방 36공간 청사진">
      <canvas
        id="v4MegaRoomBlueprint"
        data-width="1600"
        data-height="980"
      ></canvas>
    </section>

    <section class="v4-panel" aria-label="20개 초대형 방 캠페인 청사진">
      <canvas
        id="v4CampaignBlueprint"
        data-width="1600"
        data-height="650"
      ></canvas>
    </section>

    <p class="v4-note">
      저장 파일에는 검증된 체크포인트 ID만 기록합니다. 임의 좌표나 손상된 저장값은 사용하지 않으며,
      복귀는 0.7초 페이드 안에서 처리해 이미 완료한 층 전체를 다시 걷게 하지 않습니다.
    </p>
  </main>
  <noscript>JavaScript가 필요합니다.</noscript>
  <script type="module" src="src/v4/pass04-main.js?v=pass04"></script>
</body>
</html>
