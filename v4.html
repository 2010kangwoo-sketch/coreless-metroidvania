<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071015">
  <meta name="description" content="Coreless V4 프롤로그·현재 목표·비차단 튜토리얼 안내">
  <title>Coreless V4 · Story and Guidance Pass 05</title>
  <link rel="stylesheet" href="v4-style.css?v=pass05">
</head>
<body>
  <main class="v4-shell">
    <header class="v4-header">
      <div>
        <p>CORELESS · REBUILD V4</p>
        <h1>PASS 05 / STORY AND GUIDANCE</h1>
      </div>
      <span id="v4AuditStatus">AUDIT PENDING</span>
    </header>

    <section class="v4-panel v4-lab-panel" aria-label="이야기와 비차단 안내 실험실">
      <canvas
        id="v4StoryLab"
        width="1400"
        height="900"
        tabindex="0"
      ></canvas>
    </section>

    <p class="v4-note v4-lab-note">
      A/D 이동 · E 층 끝 승강기 · Tab 발견 기록 · K/F/R 안전 복귀 · C 저장 초기화.
      현재 목표는 항상 보이고, 짧은 이야기와 기록창이 표시되는 동안에도 이동과 카메라는 멈추지 않습니다.
    </p>

    <section class="v4-panel" aria-label="첫 초대형 방 36공간 청사진">
      <canvas
        id="v4MegaRoomBlueprint"
        data-width="1600"
        data-height="980"
      ></canvas>
    </section>

    <section class="v4-panel" aria-label="20개 초대형 방 캠페인 청사진">
      <canvas
        id="v4CampaignBlueprint"
        data-width="1600"
        data-height="650"
      ></canvas>
    </section>

    <p class="v4-note">
      첫 방의 이야기는 각 층마다 질문과 답을 하나씩 남깁니다. 중심 없이 깨어난 코어리스는
      잃어버린 절단 권한과 공명 날개를 되찾고, 제련 수호자를 넘어 다음 거대 구역인 냉각 수로로 향합니다.
    </p>
  </main>
  <noscript>JavaScript가 필요합니다.</noscript>
  <script type="module" src="src/v4/pass05-main.js?v=pass05"></script>
</body>
</html>
