<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071015">
  <meta name="description" content="Coreless V4 2화면 이동 실측과 20초 공간 시간 예산">
  <title>Coreless V4 · Movement Budget Pass 02</title>
  <link rel="stylesheet" href="v4-style.css?v=pass02">
</head>
<body>
  <main class="v4-shell">
    <header class="v4-header">
      <div>
        <p>CORELESS · REBUILD V4</p>
        <h1>PASS 02 / MOVEMENT BUDGET</h1>
      </div>
      <span id="v4AuditStatus">AUDIT PENDING</span>
    </header>

    <section class="v4-panel v4-lab-panel" aria-label="2화면 길이 실제 이동 실험실">
      <canvas
        id="v4MovementLab"
        width="1400"
        height="900"
        tabindex="0"
      ></canvas>
    </section>

    <p class="v4-note v4-lab-note">
      A/D 이동 · Space 가변 점프 · B 이동 중 기본 공격 · R 재시작.
      2화면 길이를 직접 통과해 20초 공간에서 순수 이동과 설계된 플레이가 각각 차지할 시간을 측정합니다.
    </p>

    <section class="v4-panel" aria-label="첫 초대형 방 36공간 청사진">
      <canvas
        id="v4MegaRoomBlueprint"
        data-width="1600"
        data-height="980"
      ></canvas>
    </section>

    <section class="v4-panel" aria-label="20개 초대형 방 캠페인 청사진">
      <canvas
        id="v4CampaignBlueprint"
        data-width="1600"
        data-height="650"
      ></canvas>
    </section>

    <p class="v4-note">
      이번 차수도 최종 그래픽 단계가 아닙니다. 단순 달리기로 채울 수 없는 시간을 억지 대기나 빈 복도로 늘리지 않고,
      읽을 수 있는 지형·의미 있는 선택·전투나 상호작용·안전한 회복으로 구성하기 위한 실측 기준을 고정합니다.
    </p>
  </main>
  <noscript>JavaScript가 필요합니다.</noscript>
  <script type="module" src="src/v4/pass02-main.js?v=pass02"></script>
</body>
</html>
