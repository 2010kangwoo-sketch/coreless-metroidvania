<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071015">
  <meta name="description" content="Coreless V4 4시간 캠페인과 12분 초대형 방 설계 청사진">
  <title>Coreless V4 · Mega Room Scale Pass 01</title>
  <link rel="stylesheet" href="v4-style.css?v=pass01">
</head>
<body>
  <main class="v4-shell">
    <header class="v4-header">
      <div>
        <p>CORELESS · REBUILD V4</p>
        <h1>PASS 01 / MEGA-ROOM SCALE</h1>
      </div>
      <span id="v4AuditStatus">AUDIT PENDING</span>
    </header>

    <section class="v4-panel" aria-label="첫 초대형 방 36공간 청사진">
      <canvas
        id="v4MegaRoomBlueprint"
        data-width="1600"
        data-height="980"
      ></canvas>
    </section>

    <section class="v4-panel" aria-label="20개 초대형 방 캠페인 청사진">
      <canvas
        id="v4CampaignBlueprint"
        data-width="1600"
        data-height="650"
      ></canvas>
    </section>

    <p class="v4-note">
      이번 차수는 최종 그래픽이나 물리를 만드는 단계가 아닙니다. 36개 공간의 크기·시간·역할·선택·실패 회수와
      20개 초대형 방의 스킬·적·스토리 순서를 먼저 고정합니다.
    </p>
  </main>
  <noscript>JavaScript가 필요합니다.</noscript>
